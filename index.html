<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valdorian</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* BARRE DU HAUT */
        header {
            height: 70px;
            background: #080808;
            border-bottom: 1px solid #222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        /* NOM DU JEU */
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* CONNEXION */
        .login {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email {
            background: #111;
            border: 1px solid #333;
            color: white;

            padding: 10px 14px;
            border-radius: 8px;

            outline: none;
            width: 220px;
        }

        .email:focus {
            border-color: #287bff;
        }

        .login-button {
            background: #287bff;
            color: white;

            border: none;
            padding: 10px 18px;

            border-radius: 8px;
            cursor: pointer;

            font-weight: bold;
        }

        .login-button:hover {
            background: #1769e0;
        }

        /* CENTRE DE LA PAGE */
        main {
            min-height: calc(100vh - 70px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .title {
            font-size: 70px;
            letter-spacing: 12px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #888;
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* BOUTON DU JEU */
        .play-button {
            background: #287bff;
            color: white;

            border: none;
            border-radius: 12px;

            padding: 16px 55px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 25px rgba(40, 123, 255, 0.25);

            transition: 0.2s;
        }

        .play-button:hover {
            transform: scale(1.05);
            background: #1769e0;
            box-shadow: 0 0 35px rgba(40, 123, 255, 0.45);
        }

        .coming-soon {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        /* TÉLÉPHONE */
        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 18px;
            }

            .email {
                width: 140px;
            }

            .title {
                font-size: 42px;
                letter-spacing: 7px;
            }

            .login {
                gap: 5px;
            }

            .login-button {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            VALDORIAN
        </div>

        <div class="login">

            <input
                class="email"
                type="email"
                placeholder="Votre adresse e-mail"
            >

            <button class="login-button">
                Se connecter
            </button>

        </div>

    </header>


    <main>

        <h1 class="title">
            VALDORIAN
        </h1>

        <p class="subtitle">
            Un nouveau monde est en préparation...
        </p>

        <button class="play-button">
            JOUER
        </button>

        <p class="coming-soon">
            Jeu actuellement en développement
        </p>

    </main>

</body>
</html>
